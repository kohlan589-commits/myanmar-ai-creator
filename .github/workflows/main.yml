name: Build Myanmar AI Creator APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip Android project
        run: |
          unzip -o MyanmarAICreatorAndroidProject.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -80
      - name: Build debug APK
        run: |
          cd project
          GRADLE_FILE=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then echo 'No Gradle wrapper found'; exit 1; fi
          chmod +x "$GRADLE_FILE"
          cd "$(dirname "$GRADLE_FILE")"
          ./gradlew assembleDebug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-AI-Creator-APK
          path: project/**/*.apk
          if-no-files-found: warn
